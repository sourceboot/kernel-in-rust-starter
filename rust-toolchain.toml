# Stable, deliberately: the scaffold needs nothing from nightly, and "install
# stable Rust" is a materially gentler first step than nightly + components.
# The cockpit's test registry is a hand-rolled link-section array (.ktest_array
# in boot/linker.ld), which is why stable suffices — settled 2026-10-16, built
# on rustc 1.98.1 (CONTRACT Part E).
[toolchain]
channel = "stable"
targets = ["x86_64-unknown-none"]
