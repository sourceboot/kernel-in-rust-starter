# The learner-owned tree: `os/` is its own cargo workspace, standalone on
# purpose — a fresh clone of the learner's repo builds with nothing but Rust
# (`cd os && cargo build --release -p boot --target x86_64-unknown-none`).
# xtask is NOT a member: it is our build tooling, lives beside `os/` in the
# sboot run dir (mirroring os-rust's arrangement), and drives this workspace
# with cwd = os/ so this file and os/.cargo/config.toml apply.
[workspace]
resolver = "2"
members = ["kernel", "boot"]

# The floor, not the pin: `channel = "stable"` floats (CONTRACT A.1-2, ruled
# 2026-10-17). `#[unsafe(naked)]` / `naked_asm!` are stable since 1.88, and
# rustup does not update a channel the machine already has, so without this a
# learner on an older stable would meet an error on the trampolines instead of
# cargo's plain "package `kernel` requires rustc 1.88".
[workspace.package]
rust-version = "1.88"
