[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
# No build script. kernel/Cargo.toml is course-owned (the grader restores it from lab
# 02 on), so this line is put back over the learner's upload before
# cargo reads any manifest — a planted kernel/build.rs can never run host code at
# grade time, and a forged `[lib] path` cannot swap the crate root.
build = false
rust-version.workspace = true

[lib]
name = "kernel"
